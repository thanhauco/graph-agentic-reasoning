[project]
name = "icm-graphrag-backend"
version = "0.1.0"
description = "Agentic GraphRAG backend for IcM incident management demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "langchain>=0.2.15",
    "langchain-core>=0.2.35",
    "langchain-openai>=0.1.23",
    "langgraph>=0.2.14",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "faker>=28.0.0",
    "tenacity>=9.0.0",
    "sse-starlette>=2.1.3",
    "neo4j>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
evals = [
    "ragas>=0.1.16",
    "datasets>=2.20.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*", "evals*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
